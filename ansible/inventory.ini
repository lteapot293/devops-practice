[proxy]
# Проксирующим балансировщиком по ТЗ сделаем машину Web-App-1
vm-0 ansible_host=192.168.1.11 ansible_user=vm1

[backends]
# Первым отдающим бэкендом будет App-2
vm-1 ansible_host=192.168.1.12 ansible_user=vm1
# Вторым отдающим бэкендом (сам на себя) будет Data-Infra
vm-2 ansible_host=127.0.0.1 ansible_user=vm1

[all:vars]
# Ключ, который уже связывали по сети в дипломе
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
