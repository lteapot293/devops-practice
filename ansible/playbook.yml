---
- name: Базовая настройка всех виртуальных машин
  hosts: all
  become: yes
  roles:
    - common

- name: Настройка отдающих бэкендов Nginx
  hosts: backends
  become: yes
  roles:
    - nginx_backend

- name: Настройка проксирующего Nginx
  hosts: proxy
  become: yes
  roles:
    - nginx_proxy
